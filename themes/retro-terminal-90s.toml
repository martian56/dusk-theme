name = "retro-terminal-90s"
description = "Teal desktop, double-line borders, and a modem singing in the next room"
base = "dusk"

[colors]
"ui.bg" = "#008080"
"ui.fg" = "#ffffff"
"ui.gutter" = "#b0e0e0"
"ui.gutter.current" = "#ffff00"
"ui.cursorline" = "#005380"
"ui.selection" = "#000080"
"ui.search" = "#00acac"
"ui.cursor" = "#ffff00"
"ui.bar" = "#004c4c"
"ui.bar.fg" = "#ffffff"
"ui.tab.active" = "#008080"
"ui.sidebar" = "#006060"
"ui.dir" = "#ffffff"
"ui.popup" = "#004c4c"
"ui.popup.selected" = "#000080"
"ui.match" = "#66b380"
"ui.error" = "#ff0000"
"ui.mode.normal" = "#ffff00"
"ui.mode.insert" = "#00ff00"
"ui.mode.visual" = "#ff00ff"
"ui.mode.command" = "#00ffff"
"ui.border" = "#6ababa"
normal = "#ffffff"
keyword = "#ffff00"
type = "#ff00ff"
constant = "#00ffff"
number = "#00ffff"
string = "#00ff00"
comment = "#b0e0e0"
function = "#ffffff"
operator = "#ffff80"
directive = "#ff00ff"
key = "#ffffff"
tag = "#ffff00"
heading = "#ffff00"
builtin = "#ffff80"

[styles]
keyword = "bold"

[glyphs]
brand = " [dusk.exe] "
"tab.dirty" = "*"
"tab.close" = "x"
"tab.sep" = "|"
"tree.open" = "-"
"tree.closed" = "+"
"border.v" = "║"
"border.h" = "═"
"corner.tl" = "╔"
"corner.tr" = "╗"
"corner.bl" = "╚"
"corner.br" = "╝"
"status.dirty" = "*"

[labels]
normal = "READY"
insert = "TYPING..."
visual = "HIGHLIGHT"
vline = "SELECT ALL"
command = "RUN..."
files = "MY FILES"
panel = "DIALOG"
